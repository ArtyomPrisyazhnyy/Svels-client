<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Landing scene studio</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #export-root {
        display: inline-block;
        background: transparent;
      }

      /* —— iPhone 15 Pro frame (devices.css-inspired, MIT picturepan2) —— */
      .iphone {
        position: relative;
        width: 393px;
        padding: 10px;
        border-radius: 55px;
        background: linear-gradient(145deg, #4a4f54 0%, #1c2124 42%, #343a3f 100%);
        box-shadow: 0 28px 60px rgba(11, 26, 24, 0.35);
      }
      .iphone__btn {
        position: absolute;
        background: #2a2f33;
        border-radius: 3px;
        z-index: 2;
      }
      .iphone__btn--silent {
        left: -3px;
        top: 108px;
        width: 3px;
        height: 26px;
      }
      .iphone__btn--volume {
        left: -3px;
        top: 148px;
        width: 3px;
        height: 48px;
      }
      .iphone__btn--power {
        right: -3px;
        top: 132px;
        width: 3px;
        height: 64px;
      }
      .iphone__screen {
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 44px;
        background: #f7f1e8;
        width: 373px;
        height: 808px;
      }
      .iphone__status {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 16px 22px 8px;
        font-size: 15px;
        font-weight: 600;
        color: #2b211c;
        background: #f7f1e8;
      }
      .iphone__island {
        position: absolute;
        z-index: 4;
        top: 12px;
        left: 50%;
        width: 126px;
        height: 34px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #050708;
      }
      .iphone__app {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #f7f1e8;
      }
      .iphone__app img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }

      /* —— macOS browser —— */
      .browser {
        width: 900px;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
        box-shadow: 0 24px 50px rgba(15, 23, 42, 0.18);
      }
      .browser__bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: linear-gradient(#eceef0, #e4e7ea);
        border-bottom: 1px solid #d5d9de;
      }
      .browser__dots {
        display: flex;
        gap: 7px;
      }
      .browser__dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
      }
      .browser__dots i:nth-child(1) {
        background: #ff5f57;
      }
      .browser__dots i:nth-child(2) {
        background: #febc2e;
      }
      .browser__dots i:nth-child(3) {
        background: #28c840;
      }
      .browser__tab {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 200px;
        padding: 4px 10px;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        color: #4b5563;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .browser__tab img {
        width: 14px;
        height: 14px;
        border-radius: 3px;
      }
      .browser__url {
        flex: 1;
        text-align: center;
        font-size: 12px;
        color: #6b7280;
      }
      .browser__shot {
        background: #f7f1e8;
      }
      .browser__shot img {
        display: block;
        width: 100%;
        height: auto;
      }

      .hero-compose {
        position: relative;
        width: 1600px;
        height: 900px;
        background: transparent;
      }
      .hero-compose .browser {
        position: absolute;
        left: 40px;
        top: 48px;
        width: 920px;
      }
      .hero-compose .iphone {
        position: absolute;
        right: 36px;
        bottom: 24px;
        transform: scale(0.92);
        transform-origin: bottom right;
      }

      .telegram {
        width: 360px;
        min-height: 420px;
        border-radius: 16px;
        overflow: hidden;
        background: #e7ebee;
        font-size: 14px;
        color: #2b211c;
        box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
      }
      .telegram__top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #fff;
        border-bottom: 1px solid #dfe5ea;
      }
      .telegram__avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #c2603f, #9e4a2f);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
      }
      .telegram__body {
        padding: 12px;
      }
      .telegram__bubble {
        max-width: 92%;
        padding: 10px 12px;
        border-radius: 14px 14px 14px 4px;
        background: #fff;
        margin-bottom: 8px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04);
      }
      .telegram__bubble p {
        margin: 0 0 4px;
        color: #7a6a60;
        font-size: 13px;
      }
      .telegram__bubble strong {
        display: block;
        margin-bottom: 6px;
        color: #2b211c;
      }
      .telegram__inline {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        color: #2aabee;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="export-root" data-scene-ready="false"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const scene = params.get('scene');
      const shot = params.get('shot');
      const domain = params.get('domain') || 'chayka-coffee.by';
      const phoneMenu = params.get('phoneMenu');
      const phoneCart = params.get('phoneCart');
      const desktopMenu = params.get('desktopMenu');
      const desktopAdmin = params.get('desktopAdmin');
      const root = document.getElementById('export-root');

      function phoneFrame(imgSrc) {
        return `
          <div class="iphone">
            <span class="iphone__btn iphone__btn--silent"></span>
            <span class="iphone__btn iphone__btn--volume"></span>
            <span class="iphone__btn iphone__btn--power"></span>
            <div class="iphone__screen">
              <div class="iphone__status"><span>9:41</span><span>▮▮▮ ⌁ 🔋</span></div>
              <div class="iphone__island" aria-hidden="true"></div>
              <div class="iphone__app"><img src="${imgSrc}" alt="" /></div>
            </div>
          </div>`;
      }

      function browserFrame(imgSrc, useAdmin) {
        const logo = phoneMenu ? phoneMenu.replace('phone-menu.png', '../public/demo-venue/images/logo.webp') : '';
        return `
          <div class="browser">
            <div class="browser__bar">
              <span class="browser__dots"><i></i><i></i><i></i></span>
              <span class="browser__tab">Чайка — ${useAdmin ? 'заказы' : 'меню'}</span>
              <span class="browser__url">${domain}</span>
            </div>
            <div class="browser__shot"><img src="${imgSrc}" alt="" /></div>
          </div>`;
      }

      function telegramMock() {
        return `
          <div class="telegram">
            <div class="telegram__top">
              <div class="telegram__avatar">S</div>
              <div><strong>Svels · Заказы</strong><div style="font-size:12px;color:#7a6a60">бот</div></div>
            </div>
            <div class="telegram__body">
              <div class="telegram__bubble">
                <strong>Новый заказ #1842</strong>
                <p>Капучино ×1 · 6,90 BYN</p>
                <p>Миндальный круассан ×2 · 13,80 BYN</p>
                <p>Доставка · ул. Набережная Чаек, 12</p>
              </div>
              <button type="button" class="telegram__inline">✅ Принять</button>
              <button type="button" class="telegram__inline">❌ Отклонить</button>
            </div>
          </div>`;
      }

      let html = '';
      if (scene === 'hero') {
        html = `<div class="hero-compose">${browserFrame(desktopMenu, false)}${phoneFrame(phoneMenu)}</div>`;
      } else if (scene === 'hero-mobile') {
        html = phoneFrame(phoneMenu);
      } else if (scene === 'phone') {
        html = phoneFrame(shot === 'cart' ? phoneCart : phoneMenu);
      } else if (scene === 'browser') {
        html = browserFrame(shot === 'admin' ? desktopAdmin : desktopMenu, shot === 'admin');
      } else if (scene === 'telegram') {
        html = telegramMock();
      }

      root.innerHTML = html;
      const imgs = [...root.querySelectorAll('img')];
      Promise.all(
        imgs.map(
          (img) =>
            new Promise((resolve) => {
              if (img.complete) resolve();
              else {
                img.onload = () => resolve();
                img.onerror = () => resolve();
              }
            }),
        ),
      ).then(() => {
        root.dataset.sceneReady = 'true';
      });
    </script>
  </body>
</html>
