<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Landing scene studio</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #export-root {
        display: inline-block;
        background: transparent;
        line-height: 0;
      }

      .scene-pad {
        display: inline-block;
        background: transparent;
        line-height: 0;
      }
      .scene-pad--hero {
        padding: 36px 28px 28px 20px;
      }
      .scene-pad--feature {
        padding: 28px 20px;
      }
      .scene-pad--hero-mobile {
        padding: 24px 16px;
      }

      /* —— iPhone 15 Pro frame (devices.css-inspired, MIT picturepan2) —— */
      .iphone {
        position: relative;
        width: 393px;
        padding: 10px;
        border-radius: 55px;
        background: linear-gradient(145deg, #4a4f54 0%, #1c2124 42%, #343a3f 100%);
      }
      .iphone--flat {
        box-shadow: none;
      }
      .iphone__btn {
        position: absolute;
        background: #2a2f33;
        border-radius: 3px;
        z-index: 2;
      }
      .iphone__btn--silent {
        left: -3px;
        top: 108px;
        width: 3px;
        height: 26px;
      }
      .iphone__btn--volume {
        left: -3px;
        top: 148px;
        width: 3px;
        height: 48px;
      }
      .iphone__btn--power {
        right: -3px;
        top: 132px;
        width: 3px;
        height: 64px;
      }
      .iphone__screen {
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border-radius: 44px;
        background: #ffffff;
        width: 373px;
        height: 808px;
      }
      .iphone__status {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 16px 22px 8px;
        font-size: 15px;
        font-weight: 600;
        color: #0b1a18;
        background: #ffffff;
      }
      .iphone__island {
        position: absolute;
        z-index: 4;
        top: 12px;
        left: 50%;
        width: 126px;
        height: 34px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #050708;
      }
      .iphone__app {
        flex: 1;
        min-height: 0;
        overflow: hidden;
        background: #ffffff;
        line-height: normal;
      }
      .iphone__app img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
      }
      .iphone__app--panel img {
        object-fit: contain;
        object-position: top center;
        background: #ffffff;
      }

      /* —— macOS browser —— */
      .browser {
        width: 100%;
        border-radius: 12px;
        overflow: hidden;
        background: #fff;
      }
      .browser--flat {
        box-shadow: none;
      }
      .browser__bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: linear-gradient(#eceef0, #e4e7ea);
        border-bottom: 1px solid #d5d9de;
      }
      .browser__dots {
        display: flex;
        gap: 7px;
      }
      .browser__dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
      }
      .browser__dots i:nth-child(1) {
        background: #ff5f57;
      }
      .browser__dots i:nth-child(2) {
        background: #febc2e;
      }
      .browser__dots i:nth-child(3) {
        background: #28c840;
      }
      .browser__tab {
        display: flex;
        align-items: center;
        gap: 6px;
        max-width: 200px;
        padding: 4px 10px;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        color: #4b5563;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .browser__url {
        flex: 1;
        text-align: center;
        font-size: 12px;
        color: #6b7280;
      }
      .browser__shot {
        background: #ffffff;
        line-height: 0;
      }
      .browser__shot img {
        display: block;
        width: 100%;
        height: auto;
        max-height: 900px;
        object-fit: cover;
        object-position: top center;
      }

      .hero-compose {
        position: relative;
        display: inline-block;
        background: transparent;
        filter: drop-shadow(0 28px 52px rgba(11, 26, 24, 0.22));
        line-height: 0;
      }
      .hero-compose__browser {
        width: 1120px;
        max-width: 100%;
      }
      .hero-compose__phone {
        position: absolute;
        right: 96px;
        bottom: 10px;
        z-index: 2;
        transform: scale(0.9);
        transform-origin: bottom right;
      }

      .feature-stage {
        display: inline-block;
        background: transparent;
        filter: drop-shadow(0 18px 36px rgba(11, 26, 24, 0.18));
        line-height: 0;
      }

      .telegram-in-phone {
        height: 100%;
        background: #e7ebee;
        font-size: 13px;
        color: #0b1a18;
        overflow: auto;
      }
      .telegram-in-phone__top {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        background: #fff;
        border-bottom: 1px solid #dfe5ea;
      }
      .telegram-in-phone__avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0f766e, #0b5f59);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 14px;
      }
      .telegram-in-phone__body {
        padding: 12px;
      }
      .telegram-in-phone__bubble {
        max-width: 92%;
        padding: 10px 12px;
        border-radius: 14px 14px 14px 4px;
        background: #fff;
        margin-bottom: 8px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.04);
      }
      .telegram-in-phone__bubble p {
        margin: 0 0 4px;
        color: #54635f;
        font-size: 12px;
      }
      .telegram-in-phone__bubble strong {
        display: block;
        margin-bottom: 6px;
        color: #0b1a18;
        font-size: 13px;
      }
      .telegram-in-phone__inline {
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: none;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        color: #2aabee;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="export-root" data-scene-ready="false"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const scene = params.get('scene');
      const shot = params.get('shot');
      const domain = params.get('domain') || 'chayka-coffee.by';
      const phoneMenu = params.get('phoneMenu');
      const phoneCart = params.get('phoneCart');
      const phoneAdmin = params.get('phoneAdmin');
      const desktopMenu = params.get('desktopMenu');
      const root = document.getElementById('export-root');

      function telegramInPhoneHtml() {
        return `
          <div class="telegram-in-phone">
            <div class="telegram-in-phone__top">
              <div class="telegram-in-phone__avatar">S</div>
              <div><strong>Svels · Заказы</strong><div style="font-size:11px;color:#54635f">бот</div></div>
            </div>
            <div class="telegram-in-phone__body">
              <div class="telegram-in-phone__bubble">
                <strong>Новый заказ #1842</strong>
                <p>Капучино ×1 · 6,90 BYN</p>
                <p>Миндальный круассан ×2 · 13,80 BYN</p>
                <p>Доставка · ул. Набережная Чаек, 12</p>
              </div>
              <button type="button" class="telegram-in-phone__inline">✅ Принять</button>
              <button type="button" class="telegram-in-phone__inline">❌ Отклонить</button>
            </div>
          </div>`;
      }

      function phoneFrame(innerHtml, flat, panelShot) {
        const flatClass = flat ? ' iphone--flat' : '';
        const appClass = panelShot ? ' iphone__app iphone__app--panel' : ' iphone__app';
        return `
          <div class="iphone${flatClass}">
            <span class="iphone__btn iphone__btn--silent"></span>
            <span class="iphone__btn iphone__btn--volume"></span>
            <span class="iphone__btn iphone__btn--power"></span>
            <div class="iphone__screen">
              <div class="iphone__status"><span>9:41</span><span>▮▮▮ ⌁ 🔋</span></div>
              <div class="iphone__island" aria-hidden="true"></div>
              <div class="${appClass}">${innerHtml}</div>
            </div>
          </div>`;
      }

      function phoneShotImage(src, panelShot) {
        return phoneFrame(`<img src="${src}" alt="" />`, true, panelShot);
      }

      function browserFrame(imgSrc) {
        return `
          <div class="browser browser--flat">
            <div class="browser__bar">
              <span class="browser__dots"><i></i><i></i><i></i></span>
              <span class="browser__tab">Чайка — меню</span>
              <span class="browser__url">${domain}</span>
            </div>
            <div class="browser__shot"><img src="${imgSrc}" alt="" /></div>
          </div>`;
      }

      let html = '';
      if (scene === 'hero') {
        html = `<div class="scene-pad scene-pad--hero"><div class="hero-compose">
          <div class="hero-compose__browser">${browserFrame(desktopMenu)}</div>
          <div class="hero-compose__phone">${phoneShotImage(phoneMenu)}</div>
        </div></div>`;
      } else if (scene === 'hero-mobile') {
        html = `<div class="scene-pad scene-pad--hero-mobile">${phoneShotImage(phoneMenu)}</div>`;
      } else if (scene === 'phone') {
        let src = phoneMenu;
        let panelShot = false;
        if (shot === 'cart') {
          src = phoneCart;
          panelShot = true;
        }
        if (shot === 'admin') src = phoneAdmin;
        const inner = shot === 'telegram' ? telegramInPhoneHtml() : `<img src="${src}" alt="" />`;
        html = `<div class="scene-pad scene-pad--feature"><div class="feature-stage">${phoneFrame(inner, true, panelShot)}</div></div>`;
      }

      root.innerHTML = html;
      const imgs = [...root.querySelectorAll('img')];
      Promise.all(
        imgs.map(
          (img) =>
            new Promise((resolve) => {
              if (img.complete) resolve();
              else {
                img.onload = () => resolve();
                img.onerror = () => resolve();
              }
            }),
        ),
      ).then(() => {
        root.dataset.sceneReady = 'true';
      });
    </script>
  </body>
</html>
