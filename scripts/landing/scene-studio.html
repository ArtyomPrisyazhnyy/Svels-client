<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Landing scene studio</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Inter, sans-serif;
      }
      #export-root {
        display: inline-block;
        background: transparent;
        line-height: 0;
      }
      .scene-pad {
        display: inline-block;
        background: transparent;
        line-height: 0;
      }
      .scene-pad--hero { padding: 96px 110px 120px 84px; }
      .scene-pad--feature { padding: 28px 18px 34px; }
      .scene-pad--hero-mobile { padding: 72px 56px 88px; }

      /* iPhone 15 Pro — screen 393×852, frame 433×882, display radius 55 */
      .iphone {
        position: relative;
        width: 433px;
        height: 882px;
        padding: 12px 17px;
        border-radius: 72px;
        background: linear-gradient(
          165deg,
          #9aa1a8 0%,
          #5e666d 12%,
          #2a3036 34%,
          #14181c 52%,
          #3c444b 76%,
          #7c848c 100%
        );
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.72),
          inset 0 0 0 1px rgba(255, 255, 255, 0.22),
          inset 0 -1px 0 rgba(0, 0, 0, 0.55);
        filter:
          drop-shadow(0 28px 46px rgba(11, 26, 24, 0.22))
          drop-shadow(0 4px 8px rgba(11, 26, 24, 0.14));
      }
      .scene-pad--feature .iphone {
        filter:
          drop-shadow(0 12px 14px rgba(11, 26, 24, 0.16))
          drop-shadow(0 2px 4px rgba(11, 26, 24, 0.12));
      }
      .iphone__btn {
        position: absolute;
        width: 3px;
        border-radius: 2px;
        background: linear-gradient(180deg, #6a7178, #2a3035 40%, #4a5158);
        box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.25);
        z-index: 3;
      }
      .iphone__btn--silent { left: -2px; top: 118px; height: 28px; }
      .iphone__btn--vol-up { left: -2px; top: 168px; height: 52px; }
      .iphone__btn--vol-down { left: -2px; top: 230px; height: 52px; }
      .iphone__btn--power { right: -2px; top: 196px; height: 78px; }
      .iphone__bezel {
        width: 399px;
        height: 858px;
        padding: 3px;
        border-radius: 58px;
        background: #050607;
      }
      .iphone__screen {
        position: relative;
        width: 393px;
        height: 852px;
        border-radius: 55px;
        overflow: hidden;
        background: #ffffff;
        display: flex;
        flex-direction: column;
      }
      .iphone__status {
        flex: 0 0 54px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 54px;
        padding: 0 22px 0 26px;
        background: #ffffff;
        color: #0b1a18;
        font-size: 16px;
        font-weight: 650;
        letter-spacing: -0.02em;
        line-height: 1;
      }
      .iphone__status-icons {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .iphone__status svg { display: block; }
      .iphone__island {
        position: absolute;
        z-index: 4;
        top: 11px;
        left: 50%;
        width: 126px;
        height: 37px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #050607;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .iphone__app {
        flex: 1 1 auto;
        min-height: 0;
        overflow: hidden;
        background: #ffffff;
        line-height: normal;
      }
      .iphone__app img {
        display: block;
        width: 393px;
        height: 798px;
        object-fit: cover;
        object-position: top center;
      }

      .browser-shadow {
        filter:
          drop-shadow(0 22px 44px rgba(11, 26, 24, 0.16))
          drop-shadow(0 2px 6px rgba(11, 26, 24, 0.08));
        line-height: 0;
      }
      .browser {
        width: 1360px;
        border-radius: 14px;
        overflow: hidden;
        background: #fff;
        border: 1px solid rgba(15, 23, 42, 0.08);
      }
      .browser__bar {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 48px;
        padding: 0 14px;
        background: linear-gradient(#f4f5f7, #e7eaee);
        border-bottom: 1px solid #d5d9de;
      }
      .browser__dots { display: flex; gap: 7px; flex: 0 0 auto; }
      .browser__dots i {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: block;
      }
      .browser__dots i:nth-child(1) { background: #ff5f57; }
      .browser__dots i:nth-child(2) { background: #febc2e; }
      .browser__dots i:nth-child(3) { background: #28c840; }
      .browser__tab {
        flex: 0 1 180px;
        padding: 5px 10px;
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
        line-height: 1.2;
        color: #3f4a46;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .browser__url {
        flex: 1 1 auto;
        margin-right: 92px;
        text-align: center;
        font-size: 12px;
        line-height: 1.2;
        color: #54635f;
        white-space: nowrap;
      }
      .browser__shot { background: #ffffff; line-height: 0; }
      .browser__shot img {
        display: block;
        width: 1360px;
        height: auto;
      }

      .hero-compose {
        position: relative;
        display: inline-block;
        background: transparent;
        line-height: 0;
      }
      .hero-phone {
        position: absolute;
        right: 0;
        bottom: 0;
        z-index: 2;
        width: 433px;
        height: 882px;
        line-height: 0;
      }
      .hero-phone .iphone { transform-origin: bottom right; }

      .telegram {
        height: 798px;
        display: flex;
        flex-direction: column;
        background-color: #8eabc0;
        background-image:
          radial-gradient(circle at 12px 12px, rgba(255, 255, 255, 0.16) 1.4px, transparent 1.6px),
          radial-gradient(circle at 28px 30px, rgba(255, 255, 255, 0.1) 1.2px, transparent 1.5px);
        background-size: 42px 42px;
        color: #0b1a18;
        font-size: 15px;
        line-height: 1.35;
      }
      .telegram__top {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: #fff;
        border-bottom: 1px solid #d7e0e6;
        flex: 0 0 auto;
      }
      .telegram__back {
        color: #2aabee;
        font-size: 22px;
        line-height: 1;
        font-weight: 500;
      }
      .telegram__avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0f766e, #0b5f59);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 16px;
        flex: 0 0 auto;
      }
      .telegram__peer { min-width: 0; }
      .telegram__peer strong { display: block; font-size: 16px; }
      .telegram__peer small { display: block; color: #54635f; font-size: 13px; }
      .telegram__body {
        flex: 1 1 auto;
        padding: 14px 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .telegram__msg { max-width: 92%; }
      .telegram__bubble {
        background: #fff;
        border-radius: 16px 16px 16px 6px;
        padding: 10px 12px 8px;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.06);
      }
      .telegram__bubble strong { display: block; margin-bottom: 4px; font-size: 15px; }
      .telegram__bubble p { margin: 0 0 2px; color: #24312e; font-size: 14px; }
      .telegram__time {
        display: block;
        margin-top: 4px;
        text-align: right;
        color: #8b9894;
        font-size: 11px;
      }
      .telegram__keyboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        margin-top: 4px;
      }
      .telegram__btn {
        padding: 9px 6px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.92);
        color: #2aabee;
        font-size: 14px;
        font-weight: 650;
      }
      .telegram__composer {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px 12px;
        background: #f4f7f8;
      }
      .telegram__input {
        flex: 1 1 auto;
        height: 36px;
        border-radius: 18px;
        background: #fff;
        border: 1px solid #e1e7ea;
        color: #8b9894;
        font-size: 14px;
        display: flex;
        align-items: center;
        padding: 0 14px;
      }
      .telegram__send {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 0;
        background: #2aabee;
        color: #fff;
        font-size: 16px;
        flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="export-root" data-scene-ready="false"></div>
    <script>
      const params = new URLSearchParams(location.search);
      const scene = params.get('scene');
      const shot = params.get('shot');
      const domain = params.get('domain') || 'chayka-coffee.by';
      const phoneMenu = params.get('phoneMenu');
      const phoneCart = params.get('phoneCart');
      const phoneAdmin = params.get('phoneAdmin');
      const desktopMenu = params.get('desktopMenu');
      const root = document.getElementById('export-root');

      const STATUS_ICONS = `
        <span class="iphone__status-icons" aria-hidden="true">
          <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor">
            <rect x="0" y="7.2" width="3" height="4.8" rx="0.6"/>
            <rect x="4.6" y="4.8" width="3" height="7.2" rx="0.6"/>
            <rect x="9.2" y="2.4" width="3" height="9.6" rx="0.6"/>
            <rect x="13.8" y="0" width="3" height="12" rx="0.6"/>
          </svg>
          <svg width="16" height="12" viewBox="0 0 16 12">
            <path d="M1.2 4.5a9.2 9.2 0 0 1 13.6 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M3.6 7a5.7 5.7 0 0 1 8.8 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="8" cy="10" r="1.15" fill="currentColor"/>
          </svg>
          <svg width="27" height="13" viewBox="0 0 27 13" fill="currentColor">
            <rect x="0.7" y="0.7" width="22" height="11.6" rx="3.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="2.3" y="2.3" width="17.2" height="8.4" rx="1.5"/>
            <path d="M24.2 4.2v4.6c1-.5 1.6-1.3 1.6-2.3s-.6-1.8-1.6-2.3z"/>
          </svg>
        </span>`;

      function phoneFrame(innerHtml) {
        return `
          <div class="iphone">
            <span class="iphone__btn iphone__btn--silent"></span>
            <span class="iphone__btn iphone__btn--vol-up"></span>
            <span class="iphone__btn iphone__btn--vol-down"></span>
            <span class="iphone__btn iphone__btn--power"></span>
            <div class="iphone__bezel">
              <div class="iphone__screen">
                <div class="iphone__status"><span>9:41</span>${STATUS_ICONS}</div>
                <div class="iphone__island" aria-hidden="true"></div>
                <div class="iphone__app">${innerHtml}</div>
              </div>
            </div>
          </div>`;
      }

      function telegramHtml() {
        return `
          <div class="telegram">
            <div class="telegram__top">
              <span class="telegram__back" aria-hidden="true">‹</span>
              <div class="telegram__avatar">S</div>
              <div class="telegram__peer"><strong>Svels · Заказы</strong><small>бот</small></div>
            </div>
            <div class="telegram__body">
              <div class="telegram__msg">
                <div class="telegram__bubble">
                  <strong>Новый заказ #1842</strong>
                  <p>Капучино ×1 · 6,90 BYN</p>
                  <p>Миндальный круассан ×2 · 13,80 BYN</p>
                  <p>Доставка · ул. Набережная Чаек, 12</p>
                  <span class="telegram__time">9:41</span>
                </div>
                <div class="telegram__keyboard">
                  <button type="button" class="telegram__btn">✅ Принять</button>
                  <button type="button" class="telegram__btn">❌ Отклонить</button>
                </div>
              </div>
              <div class="telegram__msg">
                <div class="telegram__bubble">
                  <strong>Заказ #1841 принят · готовим</strong>
                  <p>Лавандовый раф ×1, Баскский чизкейк ×1</p>
                  <span class="telegram__time">9:38</span>
                </div>
              </div>
            </div>
            <div class="telegram__composer">
              <div class="telegram__input">Сообщение</div>
              <button type="button" class="telegram__send" aria-hidden="true">➤</button>
            </div>
          </div>`;
      }

      function browserFrame(imgSrc) {
        return `
          <div class="browser-shadow">
            <div class="browser">
              <div class="browser__bar">
                <span class="browser__dots"><i></i><i></i><i></i></span>
                <span class="browser__tab">Чайка — меню</span>
                <span class="browser__url">${domain}</span>
              </div>
              <div class="browser__shot"><img src="${imgSrc}" alt="" /></div>
            </div>
          </div>`;
      }

      let html = '';
      if (scene === 'hero') {
        html = `<div class="scene-pad scene-pad--hero"><div class="hero-compose">
          ${browserFrame(desktopMenu)}
          <div class="hero-phone">${phoneFrame(`<img src="${phoneMenu}" alt="" />`)}</div>
        </div></div>`;
      } else if (scene === 'hero-mobile') {
        html = `<div class="scene-pad scene-pad--hero-mobile">${phoneFrame(`<img src="${phoneMenu}" alt="" />`)}</div>`;
      } else if (scene === 'phone') {
        let inner = `<img src="${phoneMenu}" alt="" />`;
        if (shot === 'cart') inner = `<img src="${phoneCart}" alt="" />`;
        if (shot === 'admin') inner = `<img src="${phoneAdmin}" alt="" />`;
        if (shot === 'telegram') inner = telegramHtml();
        html = `<div class="scene-pad scene-pad--feature">${phoneFrame(inner)}</div>`;
      }

      root.innerHTML = html;

      function layoutHero() {
        if (scene !== 'hero') return;
        const compose = root.querySelector('.hero-compose');
        const browser = root.querySelector('.browser');
        const phone = root.querySelector('.hero-phone .iphone');
        const browserHeight = browser.offsetHeight;
        const scale = (browserHeight * 0.775) / 882;
        const visualW = 433 * scale;
        const extend = Math.round(visualW * 0.72);
        compose.style.paddingRight = `${extend}px`;
        phone.style.transform = `scale(${scale})`;
      }

      const imgs = [...root.querySelectorAll('img')];
      Promise.all(
        imgs.map(
          (img) =>
            new Promise((resolve) => {
              if (img.complete && img.naturalWidth > 0) resolve();
              else {
                img.onload = () => resolve();
                img.onerror = () => resolve();
              }
            }),
        ),
      ).then(() => {
        layoutHero();
        requestAnimationFrame(() => {
          root.dataset.sceneReady = 'true';
        });
      });
    </script>
  </body>
</html>
