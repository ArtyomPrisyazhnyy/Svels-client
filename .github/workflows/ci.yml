name: CI

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mock API for Next static generation
        run: |
          node -e "require('http').createServer((q,r)=>{r.setHeader('Content-Type','application/json');if(q.url==='/restaurants'){r.end('[]');return;}r.writeHead(404);r.end('{}');}).listen(3000,'127.0.0.1')" &
          sleep 2

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint changed TypeScript files
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}"...HEAD | grep -E '\.(ts|tsx)$' || true)
          if [ -z "$FILES" ]; then
            echo "No .ts/.tsx files changed; skipping ESLint."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$FILES"
          npx eslint --no-error-on-unmatched-pattern $FILES

      # Полный прогон для отслеживания baseline (~60 errors); не блокирует merge.
      - name: Lint full repo (baseline, non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
      RESTAURANT_PUBLIC_REVALIDATE_SECONDS: 0
      E2E_API_URL: http://127.0.0.1:3000
      E2E_BASE_URL: http://127.0.0.1:3001
      E2E_SUPER_ADMIN_EMAIL: e2e-super@svels.test
      E2E_SUPER_ADMIN_PASSWORD: E2eSuperAdminPass123!
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/svels
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: svels
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d svels"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Svels-client
        uses: actions/checkout@v4

      - name: Checkout Svels-backend
        uses: actions/checkout@v4
        with:
          repository: ArtyomPrisyazhnyy/Svels-backend
          ref: main
          path: Svels-backend

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: Svels-backend
        run: npm ci

      - name: Configure backend environment
        working-directory: Svels-backend
        env:
          SUPER_ADMIN_EMAIL: ${{ env.E2E_SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_PASSWORD: ${{ env.E2E_SUPER_ADMIN_PASSWORD }}
        run: |
          cat > .env <<EOF
          NODE_ENV=development
          PORT=3000
          DB_HOST=localhost
          DB_PORT=5432
          DB_USERNAME=postgres
          DB_PASSWORD=postgres
          DB_NAME=svels
          REDIS_HOST=localhost
          REDIS_PORT=6379
          JWT_SECRET=ci-e2e-jwt-secret-change-me-32chars
          JWT_EXPIRES_IN=7d
          STORAGE_DRIVER=local
          NEXT_SITE_URL=http://127.0.0.1:3001
          API_PUBLIC_URL=http://127.0.0.1:3000
          REVALIDATE_SECRET=ci-revalidate-secret
          BEPAID_TEST_MODE=true
          TELEGRAM_GATEWAY_TOKEN=
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_BOT_USERNAME=
          TELEGRAM_WEBHOOK_SECRET=
          SMS_BY_TOKEN=
          SMSC_LOGIN=
          SMSC_PASSWORD=
          SUPER_ADMIN_EMAIL=${SUPER_ADMIN_EMAIL}
          SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
          EOF

      - name: Run backend migrations
        working-directory: Svels-backend
        run: npm run migration:run

      - name: Create super admin
        working-directory: Svels-backend
        run: npm run create:super-admin

      - name: Build backend
        working-directory: Svels-backend
        run: npm run build

      - name: Start backend
        working-directory: Svels-backend
        run: |
          # DevModule (/dev/last-otp) is gated on process.env.NODE_ENV at import time — must be set in shell, not only in .env.
          NODE_ENV=development npm run start:prod > /tmp/svels-backend.log 2>&1 &
          echo $! > /tmp/svels-backend.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "Backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start"
          tail -n 200 /tmp/svels-backend.log || true
          exit 1

      - name: Install client dependencies
        run: npm ci

      - name: Build client
        run: npm run build

      - name: Install Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

      - name: Upload backend logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: svels-backend-logs
          path: /tmp/svels-backend.log
          if-no-files-found: ignore
