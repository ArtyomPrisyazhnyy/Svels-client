<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Вариант B. Пошаговый чекаут</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 1280px; margin: 0; padding: 32px; background: #f8fafc; color: #0f172a; font-family: Inter, system-ui, sans-serif; }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.25; }
    p { margin: 0 0 24px; color: #64748b; font-size: 16px; line-height: 1.45; }
    .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 24px; align-items: start; }
    .desk { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    figure { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    figcaption { font-size: 14px; font-weight: 600; line-height: 1.25; }
    img { width: 100%; height: auto; display: block; border-radius: 12px; background: #e2e8f0; }
    .shapes { margin-top: 8px; }
    .shapes img { border-radius: 12px; }
  </style>
</head>
<body>
  <h1>Вариант B. Пошаговый чекаут</h1>
  <p>Светлая тема berry, тёмная wine. На кадрах кнопка-капсула. Внизу то же окно при таблетке и квадрате.</p>
  <div class="row">
    <figure class="phone">
      <figcaption>Мобильный · светлая · В зале</figcaption>
      <img src="./png/b-mobile-light-dine.png" alt="Мобильный · светлая · В зале" />
    </figure>
    <figure class="phone">
      <figcaption>Мобильный · светлая · Доставка</figcaption>
      <img src="./png/b-mobile-light-delivery.png" alt="Мобильный · светлая · Доставка" />
    </figure>
    <figure class="phone">
      <figcaption>Мобильный · тёмная · В зале</figcaption>
      <img src="./png/b-mobile-dark-dine.png" alt="Мобильный · тёмная · В зале" />
    </figure>
    <figure class="phone">
      <figcaption>Мобильный · тёмная · Доставка</figcaption>
      <img src="./png/b-mobile-dark-delivery.png" alt="Мобильный · тёмная · Доставка" />
    </figure>
  </div>
  <div class="desk">
    <figure class="wide">
      <figcaption>ПК · светлая · В зале</figcaption>
      <img src="./png/b-desktop-light-dine.png" alt="ПК · светлая · В зале" />
    </figure>
    <figure class="wide">
      <figcaption>ПК · светлая · Доставка</figcaption>
      <img src="./png/b-desktop-light-delivery.png" alt="ПК · светлая · Доставка" />
    </figure>
    <figure class="wide">
      <figcaption>ПК · тёмная · В зале</figcaption>
      <img src="./png/b-desktop-dark-dine.png" alt="ПК · тёмная · В зале" />
    </figure>
    <figure class="wide">
      <figcaption>ПК · тёмная · Доставка</figcaption>
      <img src="./png/b-desktop-dark-delivery.png" alt="ПК · тёмная · Доставка" />
    </figure>
  </div>
  <figure class="shapes">
    <figcaption>Форма кнопки: капсула, таблетка, квадрат</figcaption>
    <img src="./png/shapes-shapes.png" alt="Формы кнопок в светлой и тёмной теме" />
  </figure>
</body>
</html>
